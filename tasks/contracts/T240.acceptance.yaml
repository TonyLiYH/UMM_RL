schema_version: 1
task_id: T240
base_ref: origin/main
required_files:
  - configs/admission/uniar/storage-preflight.json
  - configs/admission/uniar/artifact-verification.json
  - configs/admission/uniar/environment-lock.md
  - configs/admission/uniar/parameter-block-registry.yaml
  - reports/T240/first-report.md
  - reports/T240/result-summary.md
  - reports/T240/claim-check.md
  - reports/T240/failure-ledger.md
  - runs/admission-uniar-v1/manifest.json
  - runs/admission-uniar-v1/metrics.json
  - runs/admission-uniar-v1/notes.md
commands:
  - name: repository-state
    command: .venv/bin/python -m comppareto.repo_state.cli --root .
  - name: full-tests
    command: .venv/bin/python -m pytest -q
  - name: compile
    command: .venv/bin/python -m compileall -q src tests
  - name: whitespace
    command: git diff --check origin/main...HEAD
metrics:
  - file: runs/admission-uniar-v1/manifest.json
    path: status
    op: "=="
    value: pass
  - file: configs/admission/uniar/storage-preflight.json
    path: status
    op: "=="
    value: pass
  - file: configs/admission/uniar/storage-preflight.json
    path: filesystem_class
    op: "=="
    value: local
  - file: configs/admission/uniar/artifact-verification.json
    path: failed
    op: "=="
    value: 0
  - file: runs/admission-uniar-v1/metrics.json
    path: smoke.understanding.exit_code
    op: "=="
    value: 0
  - file: runs/admission-uniar-v1/metrics.json
    path: smoke.generation.exit_code
    op: "=="
    value: 0
  - file: runs/admission-uniar-v1/metrics.json
    path: scope.unreleased_decoder_training_recorded
    op: "=="
    value: true
  - file: runs/admission-uniar-v1/metrics.json
    path: resources.gpu_hours
    op: "<="
    value: 8
forbidden_claims:
  - file: reports/T240/result-summary.md
    when:
      file: runs/admission-uniar-v1/manifest.json
      path: status
      equals: fail
    phrases: [supports gate, passes gate]
