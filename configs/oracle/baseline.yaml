# T155 baseline sweep grid. Values are the "resolved range for this run" from
# docs/theory/oracle-spec.md section 8 -- see that table for the reason each
# range was narrowed from the full task-file range.
config_seed: 20260827155

# One (num_tasks, num_blocks, block_width) tuple per graph family, chosen so
# that across the six families the full m in {2,3,4,6,8} and B in
# {4,8,16,32,64} ranges are each realized at least once, covering both ends.
families:
  disjoint:       {num_tasks: 8, num_blocks: 64, block_width: 2}
  full_overlap:   {num_tasks: 2, num_blocks: 4,  block_width: 1}
  star:           {num_tasks: 4, num_blocks: 16, block_width: 1}
  chain:          {num_tasks: 6, num_blocks: 32, block_width: 2}
  partial:        {num_tasks: 3, num_blocks: 8,  block_width: 1}
  random_sparse:  {num_tasks: 4, num_blocks: 16, block_width: 2}

optimizers: [sgd, momentum]
momentum_betas: [0.5, 0.9]
horizons: [1, 3, 5, 10]
stability_regimes: [stable, unstable]
seeds_per_cell: 3
noise_kinds: [gaussian, block_correlated]

private_dims: [2, 4, 8, 16, 32]
condition_numbers: [1.0, 10.0, 1000.0]
coupling_rank_modes: [low, full]
gradient_cosine_targets: [-0.8, 0.0, 0.8]
gradient_scale_targets: [1.0, 10.0, 100.0]
mu: 0.5

# Curated subset that additionally persists full trajectories/Jacobians,
# per oracle-spec.md section 11. Selected greedily by the runner to cover
# every family, optimizer, horizon, and stability regime at least once.
detailed_subset_size: 10
