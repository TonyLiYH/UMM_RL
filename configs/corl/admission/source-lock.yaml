auxiliary_models:
  - name: all-mpnet-base-v2
    purpose: "bertscore-style embedding backbone for T2ICycleConsistencyReward's
      default caption_cs_metrics=[jaccard,bertscore] path (default
      using_external_caption_model=False, so policy model captions its own
      generation; bertscore compares that caption to the source prompt)"
    hub: huggingface (sentence-transformers/all-mpnet-base-v2)
    pinned_revision: TBD_AT_DOWNLOAD_TIME
    license: Apache-2.0
    required_because: >
      corl/scripts/corl_unified.sh never sets --model_ckpt_dir; the
      GRPOScriptArguments default is the literal placeholder "XXX/checkpoint/",
      which the T2ICycleConsistencyReward.load_external_model method will
      concatenate to "XXX/checkpoint//all-mpnet-base-v2" and fail to load
      under the official default reward set (t2i_bid_cycle_reward is in the
      default reward_funcs list, and bertscore is in the default
      caption_cs_metrics list). This is recorded as upstream defect #1 in
      discrepancy-lock.yaml; the corrected_candidate smoke path supplies a
      real local --model_ckpt_dir.

