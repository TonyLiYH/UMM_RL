# Each entry: an explicit paper claim/equation/config value versus what the
# public code actually does, with file:line evidence and a verdict.
# verdict one of: match, default_mismatch (feature exists but shipped
# default differs from paper's reported config), gap (paper describes
# something not implemented at all), defect (will crash / silently wrong
# under the official launch script's own defaults).

entries:
  - id: D1
    topic: "GRPO core objective (Eq. 1-2)"
    paper: >
      Standard group-relative-advantage GRPO: A_i = (r_i - mean(r))/std(r);
      objective maximizes E[ (pi_theta/pi_theta_old) * A_i - beta * KL(pi||pi_ref) ].
    code: >
      corl/open_r1/trainer/grpo_trainer_unified.py compute_loss implements
      the ratio * advantage term with an optional beta*KL subtraction,
      matching Eq. 2 structurally.
    verdict: match
    evidence: "corl/open_r1/trainer/grpo_trainer_unified.py compute_loss()"

  - id: D2
    topic: "Stage-1 (unified RL) KL term (Sec 3.3.2: 'we omit the KL-divergence
      constraint during this stage')"
    paper: "beta = 0 in stage 1 (no reference model needed)."
    code: >
      corl_unified.sh sets beta=0.0; JanusProUnifiedGRPOTrainer.__init__ only
      constructs self.ref_model when beta > 0, else self.ref_model = None.
    verdict: match
    evidence: "corl/scripts/corl_unified.sh line 'beta=0.0'; grpo_trainer_unified.py __init__"
    smoke_implication: >
      Running only the official default config never exercises mandatory
      check #7 (reference immutability). T710's smoke plans a second,
      explicitly-labeled corrected_candidate/beta>0 variant run to exercise
      check #7, since the frozen protocol requires an explicit recorded
      outcome for it and beta=0 makes it vacuously true (no ref model
      exists to mutate).

  - id: D3
    topic: "Reward composition, stage 1 (Eq. 5): R_Uni-S1 = R_cycle + R_TIM +
      lambda*(R_Acc + R_Format), lambda=0.8 (Implementation Details, Sec 4.1)"
    paper: >
      Single combined reward per (image, text) output pair; lambda=0.8
      balances t2i-vs-understanding reward scale (paper Table 6 confirms
      lambda in [0.7, 0.8] is the paper's chosen operating point).
    code: >
      grpo_trainer_unified.py line ~611:
      unified_rewards = t2i_rewards + 0.8 * mm2t_rewards
      (and the unify_advantage branch at line ~790 does the analogous
      t2i_advantages + 0.8 * mm2t_advantages). t2i_rewards sums
      t2i_bid_cycle_reward + t2i_ti_sim; mm2t_rewards sums qa_accuracy +
      format — matching R_cycle+R_TIM and R_Acc+R_Format respectively, and
      the default corl_unified.sh reward_funcs list is exactly these four.
    verdict: match
    evidence: "corl/open_r1/trainer/grpo_trainer_unified.py:611,790; corl/scripts/corl_unified.sh reward_funcs"
    caveat: >
      lambda=0.8 is hardcoded in trainer source, not exposed as a CLI/config
      argument. Matches the paper's reported value exactly, so not a
      correctness defect for reproducing the paper's default; only a
      flexibility limitation if a different lambda is desired later.

  - id: D4
    topic: "Advantage normalization scope under unify_reward=True"
    paper: >
      Eq. 6 implies advantages are computed once, from the single combined
      reward R_Uni-S1, per group.
    code: >
      Confirmed: with unify_reward=True (the official default), rewards are
      combined first (D3) and group-normalized exactly once into
      unified_advantages, then that single advantage scales BOTH the t2i
      loss term and the mm2t loss term in compute_loss. The two loss terms
      (loss_mm2t, loss_t2i) remain numerically separate/additive, but they
      are NOT independently advantage-normalized under the official default
      (unify_advantage=False). This matches the paper's design intent (Eq.
      5-6 describe one joint reward/advantage), so this is recorded as a
      match, but is flagged because the T710 task's own GPU-smoke pseudocode
      phrase "compute rewards and separate U/G GRPO losses" could be
      misread as implying separately-normalized advantages; it does not.
    verdict: match
    evidence: "grpo_trainer_unified.py:605-670 (unify_reward branch), compute_loss()"

  - id: D5
    topic: "Bidirectional cycle consistency reward R_cycle (Eq. 3): visual
      term = 1 - LPIPS(I_real, I_gen); textual term = SPICE(P_org, C_re-cap)
      where C_re-cap is generated by an external captioner, 'we first employ
      BLIP to generate a caption'."
    paper: "Rcycle = 1 - LPIPS(Ireal, Igen) + SPICE(Porg, Cre-cap)."
    code: >
      T2ICycleConsistencyReward (corl/open_r1/rewards/r_t2i.py) supports
      BLIP captioning (generate_caption_with_external_model) but the
      GRPOScriptArguments default is using_external_caption_model=False, so
      the DEFAULT path is generate_caption_with_policy_mmgpt: the policy
      ULM captions its own generated image, self-referentially, not BLIP.
      Caption-vs-prompt scoring default is caption_cs_metrics=
      ["jaccard","bertscore"] (averaged), NOT SPICE (SPICE is only used in
      the separate, unused t2i_cap_consistency_reward function). Visual-term
      default is image_cs_metrics=["mse"] i.e. 1-MSE, NOT LPIPS, even though
      LPIPS is implemented and importable
      (torchmetrics.image.lpip.LearnedPerceptualImagePatchSimilarity) and
      is precisely what the paper's own Table 5 ablation reports as the
      best-performing visual-consistency metric (LPIPS 83.9 DPG vs MSE 83.2
      DPG).
    verdict: default_mismatch
    evidence: >
      corl/open_r1/grpo_janus_unify.py GRPOScriptArguments fields
      caption_cs_metrics (default ["jaccard","bertscore"]),
      using_external_caption_model (default False),
      image_cs_metrics (default ["mse"]); corl/open_r1/rewards/r_t2i.py
      T2ICycleConsistencyReward.__call__/compute_caption_consistency/
      compute_image_consistency.
    corrected_candidate_plan: >
      T710's corrected_candidate smoke variant will explicitly pass
      --image_cs_metrics lpips to match the paper's own best-reported
      config; the self-referential-captioning-vs-BLIP and
      jaccard+bertscore-vs-SPICE gaps are left as upstream_exact defaults
      (both are legitimate, code-supported design choices the public
      release ships with; switching captioner/scorer families is out of
      T710's "repair only locally demonstrated correctness defects" scope
      since neither one crashes or is silently wrong, they are simply
      different from the paper's prose description of its own default).

  - id: D6
    topic: "Text-image matching reward R_TIM (Eq. 4): bidirectional max-cosine
      token-level similarity between the ULM's own visual and textual token
      representations (paper explicitly says 'leverages the ULM itself')."
    paper: >
      RTIM = 1/2 * [ (1/Li) sum_j max_k cos(i_j,t_k) + (1/Lt) sum_k max_j
      cos(t_k,i_j) ].
    code: >
      t2i_match_reward (r_t2i.py) runs the policy model's own
      language_model.model forward pass over the generated image+prompt
      conversation, slices image_embeds = hidden[:, 5:5+576] (576 = 24x24 VQ
      tokens) and text_embeds = hidden[:, 586:], then calls
      token_level_max_match_similarity(image_token, text_token[mask]) per
      example (r_utils.py, not yet independently re-derived symbol-by-symbol
      against Eq. 4, but self-referential/policy-based design matches the
      paper's stated method).
    verdict: match (design-level); formula-level re-derivation of
      token_level_max_match_similarity against Eq. 4 not yet independently
      completed (see open_items below).
    evidence: "corl/open_r1/rewards/r_t2i.py t2i_match_reward()"

  - id: D7
    topic: "Accuracy reward dispatch for MC vs OE questions (Sec 3.3.1)"
    paper: >
      Two distinct binary accuracy rewards, R_MCQ-Acc and R_OE-Acc, dispatched
      by question type.
    code: >
      common_qa_accuracy_reward (r_base.py) branches on kwargs['qa_type'] ==
      'MC' (uses MCQAnswerExtractor + safe_string_equal, binary 0/1) vs the
      else branch (OE: extracts <answer> tag content, safe_string_equal for
      exact match else soft_jaccard partial credit) — so OE reward is NOT
      strictly binary in the code (soft_jaccard can return a fractional
      value on non-exact match), whereas the paper states 'a binary
      evaluation mechanism, assigning a value of 1 ... and 0 otherwise' for
      both MC and OE.
    verdict: default_mismatch
    evidence: "corl/open_r1/rewards/r_base.py common_qa_accuracy_reward(), lines ~51-70"
    note: >
      This is the batched MC/OE reward dispatch exercised by mandatory check
      #4; the dispatch itself (by qa_type) is implemented and will be
      recorded with real example outputs in runs/corl-admission-v1. The
      soft_jaccard partial-credit behavior on OE is a real code behavior,
      not a bug, and is recorded verbatim rather than "fixed" to match the
      paper's binary description, since it is a legitimate reward-shaping
      choice already present upstream, not a crash or silently-wrong
      computation.

  - id: D8
    topic: "Format reward (Sec 3.3.1, Eq. borrowed from DeepSeek-R1): binary,
      requires <think>...</think><answer>...</answer>."
    paper: "RFormat returns 1 for strict compliance and 0 otherwise."
    code: >
      format_reward (r_base.py) uses regex
      r'<think>.*?</think>[.\s]*<answer>.*?</answer>' with re.fullmatch,
      binary 1.0/0.0 — matches. A second, unused format_tag_reward gives
      partial credit per tag (not in the default reward_funcs list).
    verdict: match
    evidence: "corl/open_r1/rewards/r_base.py format_reward()"

  - id: D9
    topic: "Trainable parameters / what RL actually updates"
    paper: >
      Not explicitly enumerated at the weight level in the paper text; Sec
      4.1 states training is done with AdamW, lr 4e-6 (stage 1), on
      Janus-Pro-1B as baseline. Table 7 separately notes Janus-Pro-7B uses
      LoRA; the 1B runs (paper's main results) are described as full
      fine-tuning.
    code: >
      init_trainable_parameters (grpo_trainer_unified.py) explicitly freezes
      vision_model, aligner, gen_vision_model, gen_aligner, gen_head,
      gen_embed (requires_grad=False) and leaves only language_model.*
      trainable. This is a full-fine-tune-of-the-shared-LLM-backbone-only
      design; vision/generation-specific heads and encoders are never
      updated by GRPO, even though gen_head sits directly in the T2I
      generation forward/backward path (gradients must flow through it to
      reach language_model, even though its own weights don't update).
    verdict: >
      match (paper doesn't contradict this; consistent with
      "Foundation-then-Specialization" via a shared LLM backbone), but this
      is the authoritative source for mandatory checks #1 and #2's expected
      outcome, and for the smoke's unauthorized_parameter_changes==0 check
      (authorized = language_model.* only).
    evidence: "corl/open_r1/trainer/grpo_trainer_unified.py init_trainable_parameters()"

  - id: D10
    topic: "Image-token causal alignment for computing per-token logps
      (used both for the RL ratio/importance-weight and for T2I loss)."
    paper: >
      Not specified at implementation granularity in the paper (standard
      autoregressive next-token framing is implied throughout Sec 3).
    code: >
      _get_per_token_logps (grpo_trainer_unified.py) shifts logits by one
      position and slices with an explicit `logits_to_keep`/index-1 pattern
      consistent with standard causal LM next-token alignment, applied
      uniformly to both the 576 discrete VQ image tokens (generation branch)
      and text tokens (understanding branch) since both pass through the
      same language_model backbone. Mandatory check #3 will run a concrete
      numeric probe (construct a batch, verify logits[:, t] predicts
      input_ids[:, t+1] for a held-out image-token position) rather than
      rely on source reading alone.
    verdict: match (pending numeric verification in the GPU smoke)
    evidence: "corl/open_r1/trainer/grpo_trainer_unified.py _get_per_token_logps()"

  - id: D11
    topic: "Launch-script placeholder paths never filled in
      (model_ckpt_dir, blip_model_ckpt, dataset_cache_dir)"
    paper: "N/A — packaging/reproducibility issue, not a paper claim."
    code: >
      GRPOScriptArguments defaults: model_ckpt_dir="XXX/checkpoint/",
      blip_model_ckpt="XXX/checkpoint/blip-image-captioning-base",
      dataset_cache_dir="XXX/data/cache/". corl/scripts/corl_unified.sh
      never overrides --model_ckpt_dir or --dataset_cache_dir. Under the
      official default reward set (t2i_bid_cycle_reward active, bertscore
      in caption_cs_metrics by default), T2ICycleConsistencyReward.
      load_external_model will attempt
      BertScoreWrapper("XXX/checkpoint//all-mpnet-base-v2") and fail to find
      a real checkpoint — i.e. running corl_unified.sh completely unmodified
      would crash before the first optimizer step, purely from an
      unfilled-in path placeholder, not from a logic bug.
    verdict: defect
    evidence: >
      corl/open_r1/grpo_janus_unify.py GRPOScriptArguments field defaults;
      corl/scripts/corl_unified.sh (no --model_ckpt_dir/--dataset_cache_dir
      lines); corl/open_r1/rewards/r_t2i.py
      T2ICycleConsistencyReward.load_external_model()
    corrected_candidate_plan: >
      T710 supplies a real local --model_ckpt_dir (containing a
      locally-downloaded all-mpnet-base-v2) and --dataset_cache_dir under
      /dockerdata/t710-corl/. This is an argument-level fix behind an
      explicit CLI switch, not a source-code patch, consistent with the
      task's "repair only locally demonstrated correctness defects behind
      explicit switches" instruction. upstream_exact path preserves the
      original unfilled placeholders (and is expected to fail at reward
      construction time, which is itself a recorded, valid outcome per the
      task's pass/fail gate: "a confirmed upstream defect is a valid
      result").

  - id: D12
    topic: "Effective batch size accounting (paper: 'batch size of 16' for
      stage 1) vs corl_unified.sh's per_device_train_batch_size=1,
      gradient_accumulation_steps=4, nproc_per_node=8, num_generations=8."
    paper: "Batch size of 16 (Sec 4.1 Implementation Details)."
    code: >
      Raw product per_device_train_batch_size * grad_accum * nproc_per_node
      = 1*4*8 = 32 completions per optimizer step; divided by
      num_generations=8 gives 4 unique prompts/step, not obviously 16 under
      any single accounting convention tried. TRL's GRPOConfig batch-size
      semantics (prompt-level vs completion-level, and how
      gradient_accumulation interacts with num_generations groups) were not
      independently re-derived line-by-line in this admission pass.
    verdict: open_item
    evidence: "corl/scripts/corl_unified.sh; paper Sec 4.1"
    note: >
      Does not block the T710 smoke (T710 runs single-GPU, batch size is
      set directly and independently for the bounded run, not inherited
      from corl_unified.sh's 8-GPU config). Recorded honestly as
      unreconciled rather than guessed at.

  - id: D13
    topic: "CoRL's own pinned dependency set is internally inconsistent
      (discovered while building the venv for the GPU smoke, after the
      first-report gate was already committed/pushed)."
    paper: "N/A — packaging/reproducibility issue, not a paper claim."
    code: >
      pyproject.toml pins transformers>=4.49.0 (unbounded ceiling) and
      trl==0.18.1 (exact pin). trl 0.18.1 itself requires
      transformers>=4.50.0, one patch level above CoRL's own stated floor,
      so literally following CoRL's floor pin (transformers==4.49.0)
      produces a pip dependency-resolver warning against its own trl pin.
      Separately, sentence-transformers is left completely unpinned by
      CoRL and resolves by default to 6.0.1, which requires
      transformers>=5.0.0 and huggingface-hub>=1.3.0 — directly
      incompatible with the transformers-4.x branch Janus's custom
      modeling_vlm.py requires (transformers 5.x breaks the Janus import
      in this venv). Both conflicts were only reachable by actually
      building the venv and running pip end-to-end; they are not visible
      from reading pyproject.toml alone.
    verdict: defect
    evidence: >
      Live venv build at /root/venvs/corl (H20-FoldUMM container):
      `pip install transformers==4.49.0` succeeded and
      `from janus.models.modeling_vlm import MultiModalityCausalLM`
      imported OK, but pip emitted "trl 0.18.1 requires
      transformers>=4.50.0, but you have transformers 4.49.0, which is
      incompatible"; default unpinned sentence-transformers resolved to
      6.0.1 and pip emitted "sentence-transformers 6.0.1 requires
      transformers<6.0.0,>=5.0.0 ... but you have transformers 4.50.0,
      which is incompatible" plus a matching huggingface-hub complaint.
    corrected_candidate_plan: >
      T710's venv pins transformers==4.50.0 (satisfies trl's real floor,
      one patch above CoRL's stated floor, still within CoRL's unbounded
      ">=4.49.0" range so not a violation of CoRL's own spec) and
      sentence-transformers==3.0.1 (a transformers-4.x-compatible major
      version; confirmed by reading bert_score_wrapper.py that only the
      narrow `from sentence_transformers import util` symbol is actually
      used anywhere in CoRL, so downgrading two major versions is safe).
      Full import chain (transformers, huggingface_hub, trl core classes,
      deepspeed, datasets, sentence_transformers.util, janus
      MultiModalityCausalLM, corl.open_r1.trainer.grpo_trainer_unified.
      JanusProUnifiedGRPOTrainer, corl.open_r1.rewards.reward_funcs_registry,
      corl.open_r1.rewards.bert_score.bert_score_wrapper.BertScoreWrapper)
      verified OK end-to-end under this pin set (ALL_IMPORTS_OK marker,
      2026-09-16 21:49 CST run, exit=0). Resolved final pins recorded in
      configs/corl/admission/source-lock.yaml.

  - id: D14
    topic: "Batched MC/OE reward dispatch (mandatory check #4): qa_type is
      passed to common_qa_accuracy_reward as a per-batch LIST, not a
      per-example scalar, in the trainer's real call path."
    paper: "N/A — implementation-level dispatch defect, not a paper claim."
    code: >
      grpo_trainer_unified.py:588-594 builds
      reward_kwargs = {key: [example[key] for example in inputs for _ in
      range(num_generations)] for key in inputs[0].keys() if key in
      ["qa_problem","qa_solution","qa_type"]} then calls
      reward_func(completions=mm2t_completions, **reward_kwargs) — so
      qa_type arrives as a Python list (one entry per completion in the
      batch), e.g. ["MC","MC","OE","OE"]. common_qa_accuracy_reward
      (r_base.py line ~51) reads `if kwargs['qa_type'] == 'MC':` — comparing
      the WHOLE LIST object to the string 'MC'. This is always False
      regardless of batch content, so the MCQAnswerExtractor-based MC branch
      is structurally unreachable from the trainer's real (batched) call
      path; every completion, including true MC questions, is scored by the
      OE branch (exact-string-match else soft_jaccard fractional credit).
      D7 already recorded that the dispatch exists and that OE is not
      strictly binary; this entry adds the stronger, directly-verified fact
      that the dispatch never actually executes its MC arm in production
      usage, upgrading the severity from "default differs from paper
      description" to "the described mechanism does not run at all".
    verdict: defect
    evidence: >
      Directly executed common_qa_accuracy_reward(completions=[...,
      "<answer>The correct choice is A</answer>"], qa_solution=["<answer>A
      </answer>"], qa_type=["MC"]) in the pinned CoRL venv
      (/root/venvs/corl on H20-FoldUMM, transformers==4.50.0 pin from D13):
      returned reward 0.2 (soft_jaccard partial credit under the
      wrongly-taken OE branch), whereas
      MCQAnswerExtractor().extract_answer(...) on the same completion
      correctly extracts "A" (reward would be 1.0 under the intended MC
      dispatch). A second probe with 4 examples (2 MC exact single-letter, 2
      OE) showed kwargs['qa_type'] == 'MC' evaluates to False (confirmed via
      direct print of the boolean) even though qa_type == ["MC","MC","OE",
      "OE"] was passed; those two MC examples happened to still score
      correctly (1.0/0.0) only because their answers were single bare
      letters, which coincidentally exact-string-match under the OE branch
      too — masking the defect unless a verbose MC completion is tested.
      Raw probe outputs recorded in runs/corl-admission-v1/metrics.json
      (checks.reward_dispatch_recorded) and reports/T710/claim-check.md.
    corrected_candidate_plan: >
      Not corrected in either T710 smoke variant's actual training reward
      pipeline (both upstream_exact and corrected_candidate use
      common_qa_accuracy_reward completely unmodified, since D11 is the
      only correctness switch T710 exercises via CLI args, not source
      patches). This defect is recorded as a valid, confirmed check #4
      outcome per the task's pass/fail gate ("a confirmed upstream defect
      is a valid result"); a real fix (index qa_type per-example, i.e.
      `qa_type[idx]` inside the loop instead of the outer `kwargs['qa_type']`)
      is documented here for a future task rather than applied now, since
      patching trainer reward-dispatch logic is out of T710's declared
      scope (repair candidates are limited to switches/args, not rewriting
      reward functions).

