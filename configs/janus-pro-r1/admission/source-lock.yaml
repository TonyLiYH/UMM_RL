reward_model:
  choice: OpenGVLab/InternVL2_5-8B
  url: https://huggingface.co/OpenGVLab/InternVL2_5-8B
  revision: e9e4c0dc1db56bfab10458671519b7fa3dd29463
  license: "MIT (project) + Apache-2.0 (internlm2_5-7b-chat language backbone it merges), both declared on the HF model card"
  total_bytes: 16155492897
  rationale: >
    Upstream's own janus-rl/src/open_r1/internvl_img.py:InternVLReward offers exactly
    two officially supported reward configurations: InternVL2.5-26B (recommended for
    quality, ~52GB, upstream's README frames this as the "online"/URL-served option
    for larger-memory GPUs in one paragraph but "offline"/local-weight option in
    another -- upstream's own README is internally inconsistent on this point, noted
    as a discrepancy in reports/T720/result-summary.md) and InternVL2.5-8B (~16GB,
    the smaller of the two officially supported choices). InternVL2.5-8B is the
    smallest usable reward setup that still uses upstream's own InternVLReward class
    and prompt template unmodified, run fully offline/in-process (no network
    dependency, no service endpoint), directly satisfying the frozen protocol's
    "pinned official offline configuration" requirement.
  deployment: "offline, in-process, same GPU as the policy model (apply_api=False path of upstream's intern_reward())"
  prompt_template: '<image>\n Does this image match the description "{prompt}", please directly respond with yes or no.'
  scoring: "score = P(yes-token) / (P(yes-token) + P(no-token)) from the first generated token's softmax, case-insensitive yes/no variants summed, per upstream InternVLReward.evaluate"

