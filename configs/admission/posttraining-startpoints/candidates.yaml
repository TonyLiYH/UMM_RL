        stage anywhere in official code/docs) plus T210's functional GPU
        smoke; no explicit model-card statement asserts this stage outright.
    training_interfaces:
      trainer: HuggingFace accelerate (DeepSpeed ZeRO-2 for downstream mixed-modality path)
