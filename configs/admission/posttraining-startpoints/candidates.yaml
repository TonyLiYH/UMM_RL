        optimizer_state: "true (Lightning framework default via ckpt_path)"
        scheduler_state: "true (Lightning framework default via ckpt_path)"
        counters: "true (Lightning framework default via ckpt_path)"
        evidence: reports/T250/training-interface-audit.md#candidate-c-uniddt-mcg-njuuniddt
        caveat: >-
